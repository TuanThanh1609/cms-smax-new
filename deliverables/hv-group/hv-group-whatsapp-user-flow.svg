<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1800" viewBox="0 0 2560 1800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#f3f7ff"/>
      <stop offset="1" stop-color="#f6fbf8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#061a40"/>
      <stop offset="1" stop-color="#123a7a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a2d66" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6feb"/>
    </marker>
    <style>
      .font{font-family:Arial,'Helvetica Neue',sans-serif}
      .title{font:700 56px Arial,'Helvetica Neue',sans-serif;fill:#fff}
      .subtitle{font:400 24px Arial,'Helvetica Neue',sans-serif;fill:#cfe0ff}
      .eyebrow{font:700 18px Arial,'Helvetica Neue',sans-serif;letter-spacing:2px;fill:#67e0ad}
      .colhead{font:700 22px Arial,'Helvetica Neue',sans-serif;fill:#5d6b86;letter-spacing:1px}
      .stageNo{font:700 24px Arial,'Helvetica Neue',sans-serif;fill:#fff}
      .stageTitle{font:700 25px Arial,'Helvetica Neue',sans-serif;fill:#0b1f47}
      .body{font:400 21px Arial,'Helvetica Neue',sans-serif;fill:#34425f}
      .bodyStrong{font:700 21px Arial,'Helvetica Neue',sans-serif;fill:#132952}
      .kpi{font:700 19px Arial,'Helvetica Neue',sans-serif;fill:#0c684b}
      .chip{font:700 17px Arial,'Helvetica Neue',sans-serif;fill:#174999}
      .footer{font:400 18px Arial,'Helvetica Neue',sans-serif;fill:#60708f}
    </style>
  </defs>

  <rect width="2560" height="1800" fill="url(#bg)"/>
  <circle cx="2280" cy="90" r="260" fill="#25d366" opacity="0.05"/>
  <circle cx="130" cy="1660" r="300" fill="#2f6feb" opacity="0.045"/>

  <!-- Header -->
  <rect x="70" y="60" width="2420" height="225" rx="42" fill="url(#title)" filter="url(#shadow)"/>
  <text x="105" y="190" class="title">USER FLOW — KÊNH BÁN HÀNG WHATSAPP TẠO DOANH THU</text>
  <text x="105" y="235" class="subtitle">Từ nguồn traffic đến hội thoại, đơn hàng, mua lại và vòng lặp tối ưu bằng dữ liệu tại Indonesia</text>
  <g transform="translate(2245,111)">
    <circle cx="70" cy="70" r="63" fill="#25d366"/>
    <path d="M70 22c-26.5 0-48 21.5-48 48 0 8.3 2.1 16.2 5.9 23.1L22 117l24.2-6.2A47.8 47.8 0 0 0 70 118c26.5 0 48-21.5 48-48S96.5 22 70 22Z" fill="#fff"/>
    <path d="M56.3 51.6c-1.4-3.1-2.8-3.2-4.1-3.2l-3.5-.1c-1.2 0-3.2.5-4.9 2.3-1.7 1.8-6.4 6.3-6.4 15.3s6.6 17.8 7.5 19c.9 1.2 12.7 20.4 31.4 27.8 15.5 6.1 18.7 4.9 22.1 4.6 3.4-.3 10.9-4.4 12.4-8.7 1.5-4.3 1.5-8 1.1-8.7-.5-.8-1.7-1.2-3.5-2.1-1.8-.9-10.9-5.4-12.6-6-1.7-.6-2.9-.9-4.1.9-1.2 1.8-4.7 6-5.8 7.2-1.1 1.2-2.1 1.4-4 .5-.9-.5-3.6-1.3-6.9-3.6-2.5-1.7-5.2-4-7.9-7.4-5.5-4.9-9.2-10.9-10.2-12.7-1.1-1.8-.1-2.8.8-3.8.8-.8 1.8-2.1 2.8-3.2 1-1.1 1.2-1.8 1.8-3.1.6-1.2.3-2.3-.2-3.2-.5-.9-4-10-5.7-13.6Z" fill="#25d366"/>
  </g>

  <!-- Column headings -->
  <text x="105" y="342" class="colhead">ĐIỂM CHẠM</text>
  <text x="405" y="342" class="colhead">KHÁCH HÀNG THỰC HIỆN</text>
  <text x="1045" y="342" class="colhead">SMAX THỰC HIỆN</text>
  <text x="2205" y="342" text-anchor="middle" class="colhead">ĐO LƯỜNG KINH DOANH</text>

  <!-- Main connector -->
  <line x1="207" y1="412" x2="207" y2="1515" stroke="#b9cdf7" stroke-width="8" stroke-linecap="round"/>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect x="70" y="370" width="2420" height="205" rx="30" fill="#fff"/>
  </g>
  <circle cx="207" cy="472" r="57" fill="#2f6feb"/>
  <text x="207" y="481" text-anchor="middle" class="stageNo">01</text>
  <text x="207" y="550" text-anchor="middle" class="stageTitle">THU HÚT</text>
  <line x1="330" y1="395" x2="330" y2="550" stroke="#e0e7f4" stroke-width="2"/>
  <text x="405" y="425" class="bodyStrong">Nhấp vào điểm vào WhatsApp</text>
  <text x="405" y="462" class="body">• Quảng cáo Click-to-WhatsApp</text>
  <text x="405" y="495" class="body">• Website, Social profile, QR cửa hàng</text>
  <text x="405" y="528" class="body">• CRM / chiến dịch chăm sóc chủ động</text>
  <line x1="970" y1="395" x2="970" y2="550" stroke="#e0e7f4" stroke-width="2"/>
  <text x="1045" y="425" class="bodyStrong">Mở đúng hội thoại và ghi nhận nguồn</text>
  <text x="1045" y="462" class="body">• Nhận diện campaign / link / QR đã đưa khách vào</text>
  <text x="1045" y="495" class="body">• Gửi Welcome, khởi tạo Session và phân luồng</text>
  <text x="1045" y="528" class="body">• Lưu nguồn để đối soát đơn và doanh thu về sau</text>
  <line x1="1920" y1="395" x2="1920" y2="550" stroke="#e0e7f4" stroke-width="2"/>
  <rect x="1995" y="414" width="420" height="46" rx="23" fill="#e9f8f1"/>
  <text x="2205" y="444" text-anchor="middle" class="kpi">Hội thoại WhatsApp</text>
  <rect x="1995" y="471" width="420" height="46" rx="23" fill="#e9f8f1"/>
  <text x="2205" y="501" text-anchor="middle" class="kpi">Chi phí / Hội thoại</text>
  <text x="2205" y="540" text-anchor="middle" class="footer">Nguồn: Ads + Session Smax</text>

  <!-- Stage 2 -->
  <g filter="url(#shadow)"><rect x="70" y="595" width="2420" height="225" rx="30" fill="#fff"/></g>
  <circle cx="207" cy="707" r="57" fill="#6d5ce7"/>
  <text x="207" y="716" text-anchor="middle" class="stageNo">02</text>
  <text x="207" y="795" text-anchor="middle" class="stageTitle">TƯ VẤN</text>
  <line x1="330" y1="620" x2="330" y2="795" stroke="#e0e7f4" stroke-width="2"/>
  <text x="405" y="650" class="bodyStrong">Hỏi sản phẩm và nhu cầu làm đẹp</text>
  <text x="405" y="687" class="body">• Giá, ưu đãi, tồn kho, màu / dung tích</text>
  <text x="405" y="720" class="body">• Loại da, vấn đề da, thành phần, cách dùng</text>
  <text x="405" y="753" class="body">• So sánh Brand/SKU và tìm routine phù hợp</text>
  <line x1="970" y1="620" x2="970" y2="795" stroke="#e0e7f4" stroke-width="2"/>
  <text x="1045" y="650" class="bodyStrong">AI tư vấn 24/7 dựa trên Knowledge đã duyệt</text>
  <text x="1045" y="687" class="body">• Nhận diện ý định, hỏi thêm nhu cầu và đề xuất Brand/SKU</text>
  <text x="1045" y="720" class="body">• Gợi ý routine, voucher, bundle hoặc bước mua tiếp theo</text>
  <text x="1045" y="753" class="body">• Guardrail: câu ngoài phạm vi → chuyển nhân viên đúng nhóm</text>
  <rect x="1045" y="770" width="565" height="32" rx="16" fill="#eef1ff"/>
  <text x="1328" y="792" text-anchor="middle" class="chip">AI xử lý được?  CÓ → tiếp tục  |  KHÔNG → Handover</text>
  <line x1="1920" y1="620" x2="1920" y2="795" stroke="#e0e7f4" stroke-width="2"/>
  <text x="2205" y="660" text-anchor="middle" class="kpi">• Thời gian phản hồi</text>
  <text x="2205" y="697" text-anchor="middle" class="kpi">• Tỷ lệ AI xử lý</text>
  <text x="2205" y="734" text-anchor="middle" class="kpi">• Handover SLA</text>
  <text x="2205" y="771" text-anchor="middle" class="kpi">• Brand/SKU quan tâm</text>

  <!-- Stage 3 -->
  <g filter="url(#shadow)"><rect x="70" y="840" width="2420" height="205" rx="30" fill="#fff"/></g>
  <circle cx="207" cy="943" r="57" fill="#2d9cdb"/>
  <text x="207" y="952" text-anchor="middle" class="stageNo">03</text>
  <text x="207" y="1020" text-anchor="middle" class="stageTitle">ĐỊNH DANH</text>
  <line x1="330" y1="865" x2="330" y2="1020" stroke="#e0e7f4" stroke-width="2"/>
  <text x="405" y="895" class="bodyStrong">Đồng ý để lại thông tin và nhu cầu</text>
  <text x="405" y="932" class="body">• Số điện thoại, tên và consent nhận tin</text>
  <text x="405" y="965" class="body">• Brand/SKU quan tâm, vấn đề da và mức sẵn sàng mua</text>
  <text x="405" y="998" class="body">• Trả lời qua chat, form, minigame hoặc Webview</text>
  <line x1="970" y1="865" x2="970" y2="1020" stroke="#e0e7f4" stroke-width="2"/>
  <text x="1045" y="895" class="bodyStrong">Biến hội thoại thành hồ sơ khách hàng có thể khai thác</text>
  <text x="1045" y="932" class="body">• Lưu Attribute, chống trùng và gắn Tag tự động</text>
  <text x="1045" y="965" class="body">• Phân loại: khách mới, tiềm năng, chưa mua, đã mua, VIP</text>
  <text x="1045" y="998" class="body">• Tạo tệp theo Brand/SKU để tư vấn và remarketing</text>
  <line x1="1920" y1="865" x2="1920" y2="1020" stroke="#e0e7f4" stroke-width="2"/>
  <text x="2205" y="912" text-anchor="middle" class="kpi">• Lead định danh</text>
  <text x="2205" y="953" text-anchor="middle" class="kpi">• Tỷ lệ định danh</text>
  <text x="2205" y="994" text-anchor="middle" class="kpi">• Lead đủ điều kiện</text>

  <!-- Stage 4 -->
  <g filter="url(#shadow)"><rect x="70" y="1065" width="2420" height="245" rx="30" fill="#fff"/></g>
  <circle cx="207" cy="1188" r="57" fill="#f28b30"/>
  <text x="207" y="1197" text-anchor="middle" class="stageNo">04</text>
  <text x="207" y="1283" text-anchor="middle" class="stageTitle">MUA HÀNG</text>
  <line x1="330" y1="1090" x2="330" y2="1285" stroke="#e0e7f4" stroke-width="2"/>
  <text x="405" y="1120" class="bodyStrong">Chọn sản phẩm và hoàn tất đơn</text>
  <text x="405" y="1157" class="body">• Xem catalog/Webview, chọn biến thể và số lượng</text>
  <text x="405" y="1190" class="body">• Áp voucher/bundle, nhập địa chỉ và chọn thanh toán</text>
  <text x="405" y="1223" class="body">• Có thể dừng giữa hành trình hoặc bỏ giỏ hàng</text>
  <line x1="970" y1="1090" x2="970" y2="1285" stroke="#e0e7f4" stroke-width="2"/>
  <text x="1045" y="1120" class="bodyStrong">Rút ngắn hành trình từ tư vấn đến thanh toán</text>
  <text x="1045" y="1157" class="body">• Hiển thị đúng SKU, giá IDR, tồn kho và ưu đãi</text>
  <text x="1045" y="1190" class="body">• Cross-sell/bundle, tạo đơn, gửi hướng dẫn thanh toán</text>
  <text x="1045" y="1223" class="body">• Khách bỏ dở → follow-up; khách mua → dừng bám đuổi</text>
  <rect x="1045" y="1240" width="590" height="36" rx="18" fill="#fff2e7"/>
  <text x="1340" y="1265" text-anchor="middle" class="chip">CHƯA MUA → ghi lý do + remarketing  |  ĐÃ MUA → sau mua</text>
  <line x1="1920" y1="1090" x2="1920" y2="1285" stroke="#e0e7f4" stroke-width="2"/>
  <text x="2205" y="1128" text-anchor="middle" class="kpi">• Tỷ lệ vào giỏ</text>
  <text x="2205" y="1163" text-anchor="middle" class="kpi">• Lead → Đơn / Tỷ lệ chốt</text>
  <text x="2205" y="1198" text-anchor="middle" class="kpi">• Đơn &amp; Doanh thu WhatsApp</text>
  <text x="2205" y="1233" text-anchor="middle" class="kpi">• AOV</text>
  <text x="2205" y="1268" text-anchor="middle" class="kpi">• Doanh thu phục hồi</text>

  <!-- Stage 5 -->
  <g filter="url(#shadow)"><rect x="70" y="1330" width="2420" height="205" rx="30" fill="#fff"/></g>
  <circle cx="207" cy="1432" r="57" fill="#25a96c"/>
  <text x="207" y="1441" text-anchor="middle" class="stageNo">05</text>
  <text x="207" y="1510" text-anchor="middle" class="stageTitle">MUA LẠI</text>
  <line x1="330" y1="1355" x2="330" y2="1510" stroke="#e0e7f4" stroke-width="2"/>
  <text x="405" y="1385" class="bodyStrong">Nhận hàng, sử dụng và quay lại mua</text>
  <text x="405" y="1422" class="body">• Theo dõi trạng thái giao hàng và hướng dẫn sử dụng</text>
  <text x="405" y="1455" class="body">• Đánh giá trải nghiệm, nhận ưu đãi phù hợp</text>
  <text x="405" y="1488" class="body">• Mua lại theo chu kỳ hoặc mua sản phẩm bổ trợ</text>
  <line x1="970" y1="1355" x2="970" y2="1510" stroke="#e0e7f4" stroke-width="2"/>
  <text x="1045" y="1385" class="bodyStrong">Chăm sóc cá nhân hóa sau mua</text>
  <text x="1045" y="1422" class="body">• Tự động cập nhật đơn, giao hàng và hướng dẫn dùng</text>
  <text x="1045" y="1455" class="body">• Thu CSAT/review, voucher mua lại và loyalty</text>
  <text x="1045" y="1488" class="body">• Cross-sell theo sản phẩm đã mua và chu kỳ sử dụng</text>
  <line x1="1920" y1="1355" x2="1920" y2="1510" stroke="#e0e7f4" stroke-width="2"/>
  <text x="2205" y="1397" text-anchor="middle" class="kpi">• Giao hàng thành công</text>
  <text x="2205" y="1436" text-anchor="middle" class="kpi">• CSAT / phản hồi</text>
  <text x="2205" y="1475" text-anchor="middle" class="kpi">• Tỷ lệ &amp; doanh thu mua lại</text>

  <!-- Insight loop -->
  <rect x="70" y="1560" width="2420" height="165" rx="30" fill="#081d42" filter="url(#shadow)"/>
  <circle cx="207" cy="1642" r="57" fill="#8b5cf6"/>
  <text x="207" y="1651" text-anchor="middle" class="stageNo">06</text>
  <text x="315" y="1608" class="eyebrow">VÒNG LẶP DỮ LIỆU TĂNG TRƯỞNG</text>
  <text x="315" y="1651" class="subtitle">Đóng Session → AI Insight trích xuất nhu cầu, lý do chưa mua, cảm xúc và tiềm năng → Dashboard theo Brand/nguồn</text>
  <text x="315" y="1690" class="subtitle">Gửi Lead/Purchase &amp; giá trị đơn về Dataset → tối ưu quảng cáo, phân tệp, nội dung và ưu đãi cho vòng traffic tiếp theo</text>
  <rect x="1905" y="1596" width="515" height="94" rx="24" fill="#143a79"/>
  <text x="2163" y="1632" text-anchor="middle" class="kpi" fill="#fff" style="fill:#fff">CPA  •  ROAS  •  Doanh thu theo Brand</text>
  <text x="2163" y="1667" text-anchor="middle" class="kpi" fill="#fff" style="fill:#fff">Lý do chưa mua  •  Tăng trưởng tuần</text>
  <path d="M 2380 1580 C 2470 1500, 2480 470, 2395 400" fill="none" stroke="#67e0ad" stroke-width="7" stroke-dasharray="14 12" marker-end="url(#arrow)"/>

  <text x="80" y="1770" class="footer">Nguồn đo lường: Smax Livechat &amp; Session  •  Attribute/Tag  •  E-commerce/POS/OMS  •  Meta Dataset  •  AI Insight &amp; Statistic</text>
  <text x="2480" y="1770" text-anchor="end" class="footer">Phiên bản trình bày: HV Group — 2026</text>
</svg>
